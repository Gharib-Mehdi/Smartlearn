{% extends "base.html" %}
{% block title %}Quiz - SmartLearn{% endblock %}
{% block content %}
<section class="sl-quiz-container sl-fade-in">
  <div style="padding-top:28px;">
    <div class="sl-text-muted sl-mb-4">Question {{ numero }} / {{ total }}</div>
    <div class="sl-progress-track sl-mb-6"><div class="sl-progress-fill" style="width: {{ progress_pct }}%"></div></div>
  </div>
  <div class="sl-quiz-layout">
    <div>
      <span class="sl-badge sl-badge-accent">SmartLearn Quiz</span>
      <h2 style="font-size:2rem; font-weight:700; margin-top:18px; line-height:1.3;">{{ question.enonce }}</h2>
    </div>
    <div>
      <form method="post" action="">
        {% csrf_token %}
        <input type="hidden" name="choice_id" id="selected-choice" />
        <div style="display:grid; gap:12px;">
          {% for c in choix %}
          <button type="button" class="sl-choice-item" data-choice-id="{{ c.id }}" aria-label="Choix {{ c.lettre }}">
            <span class="sl-choice-letter">{{ c.lettre }}</span>
            <span class="sl-choice-text">{{ c.texte }}</span>
          </button>
          {% endfor %}
        </div>
        <button id="submitBtn" class="sl-btn sl-btn-primary sl-btn-lg sl-mt-6" disabled>Valider</button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
{% block extra_js %}<script src="/static/js/quiz.js"></script>{% endblock %}
